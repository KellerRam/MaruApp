name: Deploy iOS

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'android/**'
      - '__tests__/**'
  workflow_dispatch:
    inputs:
      submit:
        description: 'Enviar el .ipa a App Store Connect (TestFlight)'
        type: boolean
        default: true

concurrency:
  group: deploy-ios
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-submit:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      # Credenciales de Apple por API Key: evita sesiones interactivas y códigos 2FA.
      EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      EXPO_APPLE_TEAM_TYPE: ${{ secrets.APPLE_TEAM_TYPE }}
      EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Escribir la API Key de App Store Connect
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "EXPO_ASC_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}

      - name: Configurar el envío a App Store Connect
        run: |
          jq --arg path "$EXPO_ASC_API_KEY_PATH" \
             --arg keyId "$EXPO_ASC_KEY_ID" \
             --arg issuer "$EXPO_ASC_ISSUER_ID" \
             --arg appId "$ASC_APP_ID" \
             '.submit.production.ios = {ascApiKeyPath: $path, ascApiKeyIssuerId: $issuer, ascApiKeyId: $keyId, ascAppId: $appId}' \
             eas.json > "$RUNNER_TEMP/eas.json"
          mv "$RUNNER_TEMP/eas.json" eas.json
        env:
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}

      - name: Compilar iOS en el runner (EAS gestiona certificados y perfiles)
        run: eas build --platform ios --profile production --local --non-interactive --output "$RUNNER_TEMP/maru.ipa"

      - name: Enviar a App Store Connect
        if: github.event_name == 'push' || inputs.submit
        run: eas submit --platform ios --profile production --path "$RUNNER_TEMP/maru.ipa" --non-interactive

      - uses: actions/upload-artifact@v4
        with:
          name: maru-ios-ipa
          path: ${{ runner.temp }}/maru.ipa
          retention-days: 3

      - name: Eliminar la API Key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
